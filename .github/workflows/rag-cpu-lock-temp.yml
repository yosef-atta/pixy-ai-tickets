name: Temporary RAG CPU Lock Refresh

on:
  push:
    branches:
      - fix/rag-cpu-pytorch

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/rag-cpu-pytorch

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.9'

      - name: Refresh lockfile
        working-directory: rag-service
        run: uv lock --python 3.12

      - name: Verify CPU-only lock
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eq 'name = "(triton|nvidia-[^"]+)"|name = "cuda-(bindings|pathfinder|toolkit)"' rag-service/uv.lock; then
            echo "GPU/CUDA packages still present in rag-service/uv.lock"
            exit 1
          fi
          grep -n -A8 -B2 'name = "torch"' rag-service/uv.lock | head -40

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git status --short rag-service/uv.lock | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add rag-service/uv.lock
            git commit -m 'fix(rag): lock CPU-only PyTorch runtime'
            git push origin HEAD:fix/rag-cpu-pytorch
          else
            echo 'uv.lock already current.'
          fi
